name: flutter_voiceassistant
description: Offline voice assistant app designed for Automotive Grade Linux (AGL).

version: 0.0.1+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  provider: ^6.0.0
  grpc: ^4.0.1
  protobuf: ^3.1.0
  flutter_svg: ^2.0.10+1
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/config.json
    - assets/agl_logo_lightmode.png
    - assets/agl_logo_darkmode.png
    - assets/background_texture.svg